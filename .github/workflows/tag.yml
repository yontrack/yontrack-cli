name: Release

on:
  push:
    tags:
      - "*"

jobs:

  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Kept in step with go.mod rather than pinned separately: the pin had
          # drifted to 1.21.1 while go.mod had moved to 1.22.
          go-version-file: go.mod

      - id: version
        name: Get version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: |
          ./build_test.sh "${VERSION}"
          cp yontrack-linux-amd64 yontrack

      - name: Yontrack setup
        run: |
          COMMIT=$(git rev-parse $VERSION)
          
          ./yontrack-linux-amd64 config create \
              local \
              ${{ vars.YONTRACK_URL }} \
              --token ${{ secrets.YONTRACK_TOKEN }}
          
          ./yontrack-linux-amd64 build search \
            --project ${{ github.event.repository.name }} \
            --commit $COMMIT \
            --count 1 \
            --output env > .yontrack.env
          
          grep -v '^#' .yontrack.env | grep -v '^$' | sed 's/^export //' >> $GITHUB_ENV
    
      - name: Displays version and build
        run: |
          echo VERSION=${VERSION}
          echo YONTRACK_PROJECT_NAME=$YONTRACK_PROJECT_NAME
          echo YONTRACK_BRANCH_NAME=$YONTRACK_BRANCH_NAME
          echo YONTRACK_BUILD_NAME=$YONTRACK_BUILD_NAME

      - name: Change log since last release
        run: |
          ./yontrack build changelog export \
            --from-promotion RELEASE \
            --to $YONTRACK_BUILD_ID \
            --format markdown \
            --grouping "Features=feature|Enhancements=enhancement|Bugs=bug" \
            --alt-group "Other" > .yontrack.log.md

      - name: Release
        uses: softprops/action-gh-release@v2.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: .yontrack.log.md
          files: |
            yontrack-*
            checksums.txt

      - name: Release validation
        run: |
          # Release validation
          ./yontrack validate --validation GITHUB.RELEASE --status PASSED
          # Release label in Ontrack
          ./yontrack build set-property release $VERSION

  # Split out of the release job because the formula names the bottles, and
  # the bottles are built by installing the formula -- so the release has to
  # be published, then bottled, and only then can the tap be told about it.
  bottles:
    name: Bottles
    needs: release
    uses: ./.github/workflows/bottle.yml
    with:
      version: ${{ needs.release.outputs.version }}
      publish: true

  # Last, because the formula points at release assets that have to exist
  # before anyone runs `brew install`, and because a tap that fails to update
  # should not hold up the Yontrack bookkeeping in the release job.
  tap:
    name: Homebrew tap
    needs: [release, bottles]
    # Runs even when bottling failed. An unbottled formula is what every
    # release before this one shipped, and it installs; withholding the bump
    # because the bottle broke would leave `brew install` on the old version,
    # which is strictly worse than the version it replaced.
    #
    # `!cancelled()` rather than `always()`: cancelling a release run is how
    # a wrong tag gets stopped, and `always()` would push its formula anyway.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the checksums and the bottle manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${VERSION}" -p checksums.txt -R "${{ github.repository }}"

      - if: ${{ needs.bottles.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: bottle-manifest

      - name: Push the formula
        env:
          # A fine-grained PAT with Contents: read and write on
          # yontrack/homebrew-tap. GITHUB_TOKEN is scoped to this repository
          # and cannot push to another one. See RELEASING.md.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu

          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. ${VERSION} is released, but brew install still offers the previous version. See RELEASING.md."
            exit 1
          fi

          # Rendered from the release's own checksums.txt, so the formula pins
          # what was published rather than a second hash of a second download,
          # and from the manifest of bottles just built against it.
          #
          # No manifest means bottling failed. Rendering without one is a
          # supported shape, not a broken formula: it is what the release
          # installs to build the bottles in the first place.
          if [ ! -f bottles.txt ]; then
            echo "::warning::No bottle manifest, so ${VERSION} goes to the tap unbottled."
            : > bottles.txt
          fi
          ./homebrew_formula.sh "${VERSION}" checksums.txt bottles.txt > "${RUNNER_TEMP}/yontrack.rb"

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/yontrack/homebrew-tap.git" \
            "${RUNNER_TEMP}/tap"

          mkdir -p "${RUNNER_TEMP}/tap/Formula"
          cp "${RUNNER_TEMP}/yontrack.rb" "${RUNNER_TEMP}/tap/Formula/yontrack.rb"

          cd "${RUNNER_TEMP}/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/yontrack.rb

          # Re-running a tag renders exactly what is already there. Nothing to
          # commit is the expected outcome then, not a failure.
          if git diff --cached --quiet; then
            echo "The tap already offers ${VERSION}"
            exit 0
          fi

          git commit -m "yontrack ${VERSION}"
          git push
