name: Go

on:
  push:
    branches:
      - main
      - v5
  pull_request:
    branches:
      - main
      - v5

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Kept in step with go.mod rather than pinned separately: the pin had
          # drifted to 1.21.1 while go.mod had moved to 1.22.
          go-version-file: go.mod

      - name: Get version
        run: echo "VERSION=${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      # `git ls-files` rather than a fixed list, so a new script cannot be
      # added without being linted. No `-s` flag: shellcheck reads each file's
      # shebang, and this repo has both bash and POSIX sh scripts — forcing a
      # dialect fails .github/tag.sh, which is bash despite its .sh extension.
      # -x so it follows the `.` into test_lib.sh rather than reporting SC1091.
      - name: Shellcheck
        run: git ls-files '*.sh' '*.bash' | xargs shellcheck -x

      # build_test.sh runs the build itself and then checks what it produced,
      # so this is the build step as well as the check on it.
      - name: Build and check the artifacts
        run: ./build_test.sh "${VERSION}"

      # Runs under the runner's /bin/sh, which is dash on Ubuntu, so this is
      # also the check that install.sh has not picked up any bashisms.
      - name: Installer tests
        run: ./install_test.sh

      # The formula is rendered at release time, when a mistake in it is
      # already published. This is the only chance to catch one first.
      - name: Homebrew formula tests
        run: ./homebrew_formula_test.sh

      - if: ${{ github.event_name != 'pull_request' }}
        name: Yontrack setup
        run: |
          ./yontrack-linux-amd64 config create \
              local \
              ${{ vars.YONTRACK_URL }} \
              --token ${{ secrets.YONTRACK_TOKEN }}
          
          ./yontrack-linux-amd64 ci config \
            --graphql-log \
            --env-all GITHUB_ \
            --env-all VERSION \
            --output env > .yontrack.env
          
          grep -v '^#' .yontrack.env | grep -v '^$' | sed 's/^export //' >> $GITHUB_ENV

      - if: ${{ github.event_name != 'pull_request' }}
        name: Yontrack build validation
        run: |
          ./yontrack-linux-amd64 validate \
            --validation BUILD \
            --status PASSED

      - id: test
        name: Test
        run: go test -v ./...

      - if: ${{ always() && github.event_name != 'pull_request' }}
        name: Yontrack test validation
        run: |
          ./yontrack-linux-amd64 validate \
            --validation TESTS \
            --status ${{ steps.test.outcome == 'success' && 'PASSED' || 'FAILED' }}

  # Installs the latest *published* release, not this commit. install.sh is the
  # only thing in this repository that runs on other people's machines, and the
  # published release is what it will meet there.
  #
  # This cannot pass until a release exists carrying checksums.txt, which the
  # installer requires: 5.4.0 is the first.
  installer:
    name: Installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, ubuntu-24.04-arm covers linux/arm64, so
        # between them every published Unix binary but linux/386 gets run.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # No INSTALL_DIR: the default is what almost everyone gets, and it is
      # the whole point of the default that this needs no privileges.
      - name: Install with the default install directory
        run: ./install.sh

      - name: The default install lands in ~/.local/bin and runs
        run: |
          "$HOME/.local/bin/yontrack" version --cli

      # A directory the runner owns, so this exercises the path that needs no
      # privileges — the one the installer refuses to escalate for.
      - name: Install
        run: INSTALL_DIR="$HOME/bin" ./install.sh

      - name: The installed binary runs and reports a release version
        run: |
          "$HOME/bin/yontrack" version --cli
          "$HOME/bin/yontrack" version --cli | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'

      # The reason the installer exists. A curl download is never quarantined,
      # so if this attribute ever appears, the macOS install is broken again.
      - name: The installed binary is not quarantined
        if: runner.os == 'macOS'
        run: |
          # Asserted first: `xattr` on a missing file reports no attribute,
          # so without this the check passes when nothing was installed.
          test -x "$HOME/bin/yontrack"
          if xattr "$HOME/bin/yontrack" | grep -q com.apple.quarantine; then
            echo "the installed binary carries com.apple.quarantine"
            xattr -l "$HOME/bin/yontrack"
            exit 1
          fi
          echo "no quarantine attribute, as expected"

  # Installs from the published tap, for the same reason the installer job
  # installs the published release: what a `brew` user meets is the formula in
  # yontrack/homebrew-tap, which no commit here can be checked against.
  # homebrew_formula_test.sh covers what the formula says; only this covers
  # whether Homebrew accepts it.
  #
  # This cannot pass until a release has pushed a formula to the tap.
  homebrew:
    name: Homebrew
    runs-on: macos-latest
    steps:
      - name: Install from the tap
        run: |
          brew tap yontrack/tap
          # Homebrew 6 wants third-party taps trusted before it loads them.
          # `brew trust` does not exist before then, so this is advisory --
          # the install on the next line is the assertion.
          brew trust yontrack/tap || true
          brew install yontrack/tap/yontrack

      - name: The installed binary runs and reports a release version
        run: |
          yontrack version --cli
          yontrack version --cli | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'

      # Formulae are not quarantined and casks are, which is the whole reason
      # the tap ships a formula. If this attribute ever appears, that has
      # stopped being true.
      - name: The installed binary is not quarantined
        run: |
          target="$(brew --prefix)/bin/yontrack"
          # Asserted first: `xattr` on a missing file reports no attribute,
          # so without this the check passes when nothing was installed.
          test -x "$target"
          if xattr "$target" | grep -q com.apple.quarantine; then
            echo "the installed binary carries com.apple.quarantine"
            xattr -l "$target"
            exit 1
          fi
          echo "no quarantine attribute, as expected"
