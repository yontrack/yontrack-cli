name: Bottle trial

# TEMPORARY -- deleted in the commit that follows the verification run.
#
# workflow_dispatch only fires for workflows already on the default branch,
# so bottle.yml cannot be exercised from a branch without this.

on:
  push:
    branches:
      - 67-bottle-the-formula

permissions:
  contents: write

jobs:
  trial:
    uses: ./.github/workflows/bottle.yml
    with:
      version: "5.5.0"
      publish: false
